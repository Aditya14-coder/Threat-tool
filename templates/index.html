<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatTool - Upload Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="tl-navbar">
    <div class="tl-navbar-brand">
        <span class="tl-logo-icon">⬡</span>
        <span class="tl-logo-text">ThreatTool</span>
        <span class="tl-logo-sub">SOC Platform</span>
    </div>
    <div class="tl-navbar-right">
    <button class="tl-theme-btn" onclick="toggleTheme()" id="themeBtn">
        ☀ Light mode
    </button>
    <a href="/lookup-page" class="tl-nav-btn tl-nav-btn-danger">
            <span>🛡</span> Threat Intel
        </a>
    </div>
</nav>

<div class="tl-upload-wrap">
    <div class="tl-upload-card">
        <div class="tl-upload-icon">⬡</div>
        <h1 class="tl-upload-title">Upload Security Log</h1>
        <p class="tl-upload-sub">Upload a log file to begin automated threat analysis</p>

        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file"
                   name="logfile"
                   accept=".json,.log,.txt"
                   class="tl-file-input">
            <button type="submit" class="tl-submit-btn">Analyze Logs</button>
        </form>

        {% if error %}
        <div class="tl-error">{{ error }}</div>
        {% endif %}

        <div class="tl-formats">
            <span class="tl-format-pill">Windows JSON .json</span>
            <span class="tl-format-pill">Wazuh .json</span>
            <span class="tl-format-pill">Linux syslog .log</span>
            <span class="tl-format-pill">Systemd journal .log</span>
            <span class="tl-format-pill">RFC 5424 .log</span>
            <span class="tl-format-pill">Journalctl JSON .log</span>
        </div>
    </div>
</div>
<script>
function applyTheme(theme) {
    if (theme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeBtn').innerHTML = '☾ Dark mode';
    } else {
        document.body.classList.remove('light-mode');
        document.getElementById('themeBtn').innerHTML = '☀ Light mode';
    }
}

function toggleTheme() {
    const isLight = document.body.classList.contains('light-mode');
    const newTheme = isLight ? 'dark' : 'light';
    localStorage.setItem('tl-theme', newTheme);
    applyTheme(newTheme);
}

// Apply saved theme immediately on page load
const savedTheme = localStorage.getItem('tl-theme') || 'dark';
applyTheme(savedTheme);
</script>
</body>
</html>
