<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLens - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="tl-upload-wrap">
    <div class="tl-upload-card" style="max-width:420px;">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; color:#ef4444;">⬡</div>
            <h1 class="tl-upload-title">ThreatLens</h1>
            <p class="tl-upload-sub">SOC Alert Investigation Platform</p>
        </div>

        <form action="/login" method="POST">
            <div class="tl-field">
                <label class="tl-label">Username</label>
                <input type="text"
                       name="username"
                       class="tl-input"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>
            <div class="tl-field" style="margin-top:1rem;">
    <label class="tl-label">Password</label>
    <div style="position:relative;">
        <input type="password"
               name="password"
               id="loginPassword"
               class="tl-input"
               placeholder="Enter your password"
               autocomplete="current-password"
               style="padding-right:42px;"
               required>
        <button type="button"
                onclick="togglePassword('loginPassword', this)"
                style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                       background:none; border:none; cursor:pointer; color:#64748b;
                       font-size:1rem; padding:0;">
            👁
        </button>
    </div>
</div>

            {% if error %}
            <div class="tl-error" style="margin-top:1rem;">{{ error }}</div>
            {% endif %}

            <button type="submit" class="tl-submit-btn" style="margin-top:1.5rem;">
                Sign In
            </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; display:flex; flex-direction:column; gap:10px;">
    <span style="color:#64748b; font-size:0.82rem;">
        Don't have an account?
        <a href="/register" style="color:#ef4444; font-weight:600;">Register here</a>
    </span>
    <a href="/" style="color:#475569; font-size:0.78rem;">
        Continue without login →
    </a>
</div>

    </div>
</div>

<script>
const savedTheme = localStorage.getItem('tl-theme') || 'dark';
if (savedTheme === 'light') document.body.classList.add('light-mode');
</script>
<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (input.type === "password") {
        input.type = "text";
        btn.style.opacity = "1";
    } else {
        input.type = "password";
        btn.style.opacity = "0.5";
    }
}
const savedTheme = localStorage.getItem('tl-theme') || 'dark';
if (savedTheme === 'light') document.body.classList.add('light-mode');
</script>
</body>
</html>
