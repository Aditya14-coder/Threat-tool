<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLens - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="tl-upload-wrap">
    <div class="tl-upload-card" style="max-width:440px;">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; color:#ef4444;">⬡</div>
            <h1 class="tl-upload-title">Create Account</h1>
            <p class="tl-upload-sub">Register to access ThreatLens</p>
        </div>

        <form action="/register" method="POST">

            <div class="tl-field">
                <label class="tl-label">Username</label>
                <input type="text"
                       name="username"
                       class="tl-input"
                       placeholder="Choose a username (min 3 chars)"
                       required>
            </div>

            <div class="tl-field" style="margin-top:1rem;">
                <label class="tl-label">Password</label>
                <input type="password"
                       name="password"
                       class="tl-input"
                       placeholder="Min 6 characters"
                       required>
            </div>

            <div class="tl-field" style="margin-top:1rem;">
                <label class="tl-label">Confirm Password</label>
                <input type="password"
                       name="confirm"
                       class="tl-input"
                       placeholder="Repeat your password"
                       required>
            </div>

            {% if error %}
            <div class="tl-error" style="margin-top:1rem;">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div style="background:#0f2a1a; color:#86efac; border:1px solid #166534;
                        border-radius:6px; padding:10px 14px; font-size:0.82rem;
                        margin-top:1rem;">
                {{ success }}
            </div>
            {% endif %}

            <button type="submit" class="tl-submit-btn" style="margin-top:1.5rem;">
                Create Account
            </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem;">
            <span style="color:#64748b; font-size:0.82rem;">
                Already have an account?
                <a href="/login" style="color:#ef4444; font-weight:600;">Sign in</a>
            </span>
        </div>

    </div>
</div>

<script>
const savedTheme = localStorage.getItem('tl-theme') || 'dark';
if (savedTheme === 'light') document.body.classList.add('light-mode');
</script>

</body>
</html>
