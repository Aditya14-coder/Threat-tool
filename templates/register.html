<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLens - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="tl-upload-wrap">
    <div class="tl-upload-card" style="max-width:440px;">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; color:#ef4444;">⬡</div>
            <h1 class="tl-upload-title">Create Account</h1>
            <p class="tl-upload-sub">Register to access ThreatLens</p>
        </div>

        <form action="/register" method="POST">

            <div class="tl-field">
                <label class="tl-label">Username</label>
                <input type="text"
                       name="username"
                       class="tl-input"
                       placeholder="Choose a username (min 3 chars)"
                       required>
            </div>

            
    <div class="tl-field" style="margin-top:1rem;">
    <label class="tl-label">Password</label>
    <div style="position:relative;">
        <input type="password"
               name="password"
               id="regPassword"
               class="tl-input"
               placeholder="Min 6 characters"
               style="padding-right:42px;"
               required>
        <button type="button"
                onclick="togglePassword('regPassword', this)"
                style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                       background:none; border:none; cursor:pointer; color:#64748b;
                       font-size:1rem; padding:0;">
            👁
        </button>
    </div>
</div>

<div class="tl-field" style="margin-top:1rem;">
    <label class="tl-label">Confirm Password</label>
    <div style="position:relative;">
        <input type="password"
               name="confirm"
               id="regConfirm"
               class="tl-input"
               placeholder="Repeat your password"
               style="padding-right:42px;"
               required>
        <button type="button"
                onclick="togglePassword('regConfirm', this)"
                style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                       background:none; border:none; cursor:pointer; color:#64748b;
                       font-size:1rem; padding:0;">
            👁
        </button>
    </div>
</div>

            {% if error %}
            <div class="tl-error" style="margin-top:1rem;">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div style="background:#0f2a1a; color:#86efac; border:1px solid #166534;
                        border-radius:6px; padding:10px 14px; font-size:0.82rem;
                        margin-top:1rem;">
                {{ success }}
            </div>
            {% endif %}

            <button type="submit" class="tl-submit-btn" style="margin-top:1.5rem;">
                Create Account
            </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem;">
            <span style="color:#64748b; font-size:0.82rem;">
                Already have an account?
                <a href="/login" style="color:#ef4444; font-weight:600;">Sign in</a>
            </span>
        </div>

    </div>
</div>

<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (input.type === "password") {
        input.type = "text";
        btn.style.opacity = "1";
    } else {
        input.type = "password";
        btn.style.opacity = "0.5";
    }
}

const savedTheme = localStorage.getItem('tl-theme') || 'dark';
if (savedTheme === 'light') document.body.classList.add('light-mode');
</script>
</body>
</html>
